<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Michael Vondra — Creative Producer &amp; Videotvůrce. Kontakt.">
    <title>Michael Vondra — Creative Producer & Videotvůrce</title>
    <link rel="icon" type="image/svg+xml" href="/assets/images/monogram.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.min.css">
</head>
<body>

    <section class="hero" id="hero">
        <div class="hero-bg"></div>
        <div class="hero-overlay"></div>
        <div class="hero-grain"></div>

        <div class="hero-content">
            <span class="hero-ing">Ing.</span>
            <h1 class="hero-name">Michael<br>Vondra</h1>
            <p class="hero-subtitle">Creative Producer & Videotvůrce</p>
            <p class="hero-tagline" id="hero-tagline"><span class="typing-cursor">|</span></p>
        </div>

        <div class="hero-scroll-indicator">
            <span class="scroll-label">Scroll</span>
            <div class="scroll-line"></div>
        </div>
    </section>

    <!-- Kontakt -->
    <section class="contact" id="kontakt">
        <div class="contact-inner">
            <span class="section-tag">Kontakt</span>
            <h2 class="contact-heading">Napište mi.</h2>
            <p class="contact-sub">Máte projekt, nápad nebo otázku? Napište mi — odpovím do&nbsp;24&nbsp;hodin.</p>

            <div class="form-success" data-fs-success>
                <p>Zpráva odeslána. Ozvu se do&nbsp;24&nbsp;hodin.</p>
            </div>
            <div class="form-error-global" data-fs-error></div>

            <form class="contact-form" id="contact-form">
                <div class="form-row">
                    <div class="form-field">
                        <label for="name">Jméno</label>
                        <input type="text" id="name" name="name" placeholder="Jan Novák" required data-fs-field>
                        <span class="form-field-error" data-fs-error="name"></span>
                    </div>
                    <div class="form-field">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="jan@example.cz" required data-fs-field>
                        <span class="form-field-error" data-fs-error="email"></span>
                    </div>
                </div>
                <div class="form-field">
                    <label for="message">Zpráva</label>
                    <textarea id="message" name="message" rows="5" placeholder="Popište projekt nebo jen pozdravte..." required data-fs-field></textarea>
                    <span class="form-field-error" data-fs-error="message"></span>
                </div>
                <button type="submit" class="form-submit" data-fs-submit-btn>Odeslat zprávu</button>
                <a href="mailto:vondra.michael@gmail.com" class="contact-link-email contact-link-email--inline">
                    <span class="contact-link-label">E-mail</span>
                    <span class="contact-link-value">vondra.michael@gmail.com</span>
                </a>
            </form>


            <div class="contact-links">
                <a href="/assets/files/Vondra_Michael_CV.pdf" download class="cv-download-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    Stáhnout CV
                </a>
                <div class="contact-socials">
                    <a href="https://www.linkedin.com/in/ing-michael-vondra-b0b936276/" target="_blank" rel="noopener" class="social-icon-btn" aria-label="LinkedIn">
                        <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
                    </a>
                    <a href="https://www.instagram.com/videobobik/" target="_blank" rel="noopener" class="social-icon-btn" aria-label="Instagram">
                        <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
                    </a>
                </div>
            </div>

        </div>
    </section>

    <script>
    // Hero tagline typing efekt
    (function () {
        const segments = ['„Natáčím, řídím produkce', null, 'a občas dělám obojí najednou."'];
        const el = document.getElementById('hero-tagline');
        if (!el) return;
        const cursor = el.querySelector('.typing-cursor');
        const steps = [];
        segments.forEach(seg => {
            if (seg === null) steps.push({ br: true });
            else for (const ch of seg) steps.push(ch);
        });
        let i = 0;
        function typeNext() {
            if (i >= steps.length) { cursor.classList.add('is-done'); return; }
            const step = steps[i++];
            if (step.br) cursor.before(document.createElement('br'));
            else cursor.before(document.createTextNode(step));
            setTimeout(typeNext, 38 + (Math.random() - 0.5) * 20);
        }
        setTimeout(typeNext, 1300);
    })();

    // Hero parallax
    const heroBg = document.querySelector('.hero-bg');
    window.addEventListener('scroll', () => {
        if (heroBg) heroBg.style.transform = `scale(1.06) translateY(${window.scrollY * 0.25}px)`;
    }, { passive: true });

    // Fade-in kontaktu při scrollu
    (function () {
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('is-visible');
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
        ['.contact-heading', '.contact-sub', '.contact-form', '.contact-links'].forEach(sel => {
            document.querySelectorAll(sel).forEach(el => { el.classList.add('anim-fade'); observer.observe(el); });
        });
    })();
    </script>
    <script src="https://unpkg.com/@formspree/ajax@1" defer></script>
    <script>
        window.formspree = window.formspree || function () { (formspree.q = formspree.q || []).push(arguments); };
        formspree('initForm', { formElement: '#contact-form', formId: 'maqznbql' });
    </script>
</body>
</html>
